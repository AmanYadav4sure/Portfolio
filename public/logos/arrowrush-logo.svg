<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Arrow Rush — animated arrow-hit tile in the game's own palette -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8CE94C" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8CE94C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="110" fill="#F5F8F2"/>
  <circle cx="336" cy="256" r="170" fill="url(#glow)"/>

  <!-- speed lines -->
  <g stroke="#1A4B00" stroke-width="12" stroke-linecap="round">
    <line x1="48" y1="196" x2="98" y2="196">
      <animate attributeName="opacity" values="0.15;0.7;0.15" dur="0.9s" repeatCount="indefinite"/>
    </line>
    <line x1="64" y1="320" x2="104" y2="320">
      <animate attributeName="opacity" values="0.7;0.15;0.7" dur="0.9s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- target -->
  <circle cx="336" cy="256" r="112" fill="#8CE94C" stroke="#1A1C19" stroke-width="10"/>
  <circle cx="336" cy="256" r="82" fill="#F5F8F2" stroke="#1A1C19" stroke-width="8"/>
  <circle cx="336" cy="256" r="56" fill="#FFD12F" stroke="#1A1C19" stroke-width="8"/>
  <circle cx="336" cy="256" r="30" fill="#FF6B35" stroke="#1A1C19" stroke-width="8"/>
  <circle cx="336" cy="256" r="10" fill="#1A1C19"/>

  <!-- touch ripples -->
  <circle cx="336" cy="256" r="14" fill="none" stroke="#FF6B35" stroke-width="10">
    <animate attributeName="r" values="20;150" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="336" cy="256" r="14" fill="none" stroke="#8CE94C" stroke-width="10">
    <animate attributeName="r" values="20;150" dur="1.8s" begin="-0.9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0" dur="1.8s" begin="-0.9s" repeatCount="indefinite"/>
  </circle>

  <!-- arrow (recoils on each hit) -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; -12 0; 3 0; 0 0; 0 0"
      keyTimes="0; 0.12; 0.2; 0.3; 1"
      dur="1.8s" repeatCount="indefinite"/>

    <rect x="104" y="247" width="214" height="18" rx="9" fill="#FFD12F" stroke="#1A1C19" stroke-width="8"/>
    <path d="M316 230 L362 256 L316 282 Z" fill="#8CE94C" stroke="#1A1C19" stroke-width="8" stroke-linejoin="round"/>
    <path d="M112 247 L64 226 L58 248 Z" fill="#FF6B35" stroke="#1A1C19" stroke-width="8" stroke-linejoin="round"/>
    <path d="M112 265 L64 286 L58 264 Z" fill="#8CE94C" stroke="#1A1C19" stroke-width="8" stroke-linejoin="round"/>
  </g>

  <!-- impact sparks -->
  <g stroke="#FF6B35" stroke-width="10" stroke-linecap="round">
    <line x1="382" y1="216" x2="398" y2="200">
      <animate attributeName="opacity" values="1;0;1;0" keyTimes="0;0.1;0.5;0.6" dur="1.8s" repeatCount="indefinite"/>
    </line>
    <line x1="386" y1="296" x2="402" y2="312">
      <animate attributeName="opacity" values="0;1;0;1" keyTimes="0;0.1;0.5;0.6" dur="1.8s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
