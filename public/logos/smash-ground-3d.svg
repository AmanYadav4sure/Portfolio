<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="110" fill="url(#sky)"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="110" cy="120" rx="46" ry="20"/>
    <ellipse cx="420" cy="180" rx="38" ry="16"/>
  </g>

  <!-- motion lines -->
  <g stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.75">
    <line x1="212" y1="96" x2="212" y2="138"/>
    <line x1="262" y1="76" x2="262" y2="130"/>
    <line x1="312" y1="96" x2="312" y2="138"/>
  </g>

  <!-- smash ball -->
  <circle cx="256" cy="196" r="64" fill="#f97316"/>
  <ellipse cx="232" cy="170" rx="20" ry="11" fill="#ffffff" opacity="0.55" transform="rotate(-28 232 170)"/>

  <!-- impact star -->
  <path d="M256 276 l14 30 30 14 -30 14 -14 30 -14 -30 -30 -14 30 -14 Z" fill="#fef08a"/>

  <!-- platform top -->
  <ellipse cx="256" cy="368" rx="140" ry="42" fill="#dfbe93"/>

  <!-- platform side -->
  <path d="M116 368 v36 a140 42 0 0 0 280 0 v-36" fill="#8c5e2d"/>
  <ellipse cx="256" cy="368" rx="140" ry="42" fill="#dfbe93" stroke="#3d2410" stroke-width="12"/>
  <path d="M116 368 v36 a140 42 0 0 0 280 0 v-36" fill="none" stroke="#3d2410" stroke-width="12" stroke-linecap="round"/>
</svg>
