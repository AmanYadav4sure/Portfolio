<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Smash Ground 3D — animated: ball drops, smashes platform, ripples, squash -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <clipPath id="smClip"><rect width="512" height="512" rx="110"/></clipPath>
  </defs>

  <g clip-path="url(#smClip)">
    <rect width="512" height="512" fill="url(#sky)"/>

    <!-- drifting clouds -->
    <g fill="#ffffff" opacity="0.85">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 16 0; 0 0" dur="9s" repeatCount="indefinite"/>
        <ellipse cx="110" cy="120" rx="46" ry="20"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; -14 0; 0 0" dur="11s" repeatCount="indefinite"/>
        <ellipse cx="420" cy="180" rx="38" ry="16"/>
      </g>
    </g>

    <!-- speed lines flicker during the drop -->
    <g stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.75">
      <animate attributeName="opacity" values="0.8;0.3;0.05;0.05;0.8" keyTimes="0;0.18;0.3;0.55;1" dur="2.4s" repeatCount="indefinite"/>
      <line x1="212" y1="96" x2="212" y2="138"/>
      <line x1="262" y1="76" x2="262" y2="130"/>
      <line x1="312" y1="96" x2="312" y2="138"/>
    </g>

    <!-- impact ripples on platform top -->
    <ellipse cx="256" cy="330" fill="none" stroke="#fef08a" stroke-width="10">
      <animate attributeName="rx" values="0;0;30;120;120" keyTimes="0;0.3;0.36;0.6;1" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="0;0;8;30;30" keyTimes="0;0.3;0.36;0.6;1" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.3;0.34;0.6;1" dur="2.4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="256" cy="330" fill="none" stroke="#ffffff" stroke-width="8">
      <animate attributeName="rx" values="0;0;25;100;100" keyTimes="0;0.52;0.58;0.82;1" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="0;0;7;25;25" keyTimes="0;0.52;0.58;0.82;1" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.85;0;0" keyTimes="0;0.52;0.56;0.82;1" dur="2.4s" repeatCount="indefinite"/>
    </ellipse>

    <!-- platform with squash -->
    <g transform="translate(256 368)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1 1;1.05 0.92;1 1" keyTimes="0;0.32;0.5" dur="2.4s" repeatCount="indefinite"/>
        <path d="M-140 0 v36 a140 42 0 0 0 280 0 v-36" fill="#8c5e2d"/>
        <ellipse rx="140" ry="42" fill="#dfbe93" stroke="#3d2410" stroke-width="12"/>
        <path d="M-140 0 v36 a140 42 0 0 0 280 0 v-36" fill="none" stroke="#3d2410" stroke-width="12" stroke-linecap="round"/>
      </g>
    </g>

    <!-- impact star -->
    <path d="M256 276 l14 30 30 14 -30 14 -14 30 -14 -30 -30 -14 30 -14 Z" fill="#fef08a">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.6s" repeatCount="indefinite"/>
    </path>

    <!-- smash ball -->
    <g transform="translate(256 196)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 -150; 0 90; 0 40; 0 90; 0 90" keyTimes="0;0.3;0.42;0.52;1" dur="2.4s" repeatCount="indefinite"/>
        <g>
          <animateTransform attributeName="transform" type="scale" values="1 1;1.3 0.72;1 1;1.12 0.88;1 1;1 1" keyTimes="0;0.3;0.4;0.52;0.6;1" dur="2.4s" repeatCount="indefinite"/>
          <circle r="64" fill="#f97316"/>
          <ellipse cx="-24" cy="-26" rx="20" ry="11" fill="#ffffff" opacity="0.55" transform="rotate(-28 -24 -26)"/>
        </g>
      </g>
    </g>

    <!-- impact sparks -->
    <g stroke="#fef08a" stroke-width="12" stroke-linecap="round">
      <line x1="196" y1="286" x2="178" y2="268">
        <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.3;0.34;0.46;1" dur="2.4s" repeatCount="indefinite"/>
      </line>
      <line x1="316" y1="286" x2="334" y2="268">
        <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.3;0.34;0.46;1" dur="2.4s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>
</svg>
