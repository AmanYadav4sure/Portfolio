<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- QR Maker — real logo, animated with glow, bob and sparkles -->
  <defs>
    <radialGradient id="qrGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="256" cy="256" r="230" fill="url(#qrGlow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="3.4s" repeatCount="indefinite"/>
    <image href="data:image/png;base64," x="16" y="16" width="480" height="480"/>
  </g>

  <g fill="#7c5cff">
    <path d="M64 72 l9 20 20 9 -20 9 -9 20 -9 -20 -20 -9 20 -9 Z">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="2.2s" begin="0s" repeatCount="indefinite"/>
    </path>
    <path d="M448 100 l8 18 18 8 -18 8 -8 18 -8 -18 -18 -8 18 -8 Z" fill="#35c7e8">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="2.2s" begin="-0.55s" repeatCount="indefinite"/>
    </path>
    <path d="M70 414 l8 18 18 8 -18 8 -8 18 -8 -18 -18 -8 18 -8 Z" fill="#35c7e8">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="2.2s" begin="-1.1s" repeatCount="indefinite"/>
    </path>
    <path d="M452 402 l9 20 20 9 -20 9 -9 20 -9 -20 -20 -9 20 -9 Z">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="2.2s" begin="-1.65s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
