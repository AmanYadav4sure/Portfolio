<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Arrow Rush mascot">
  <!-- motion trail -->
  <g stroke="#7c5cff" stroke-width="22" stroke-linecap="round" opacity="0.35">
    <line x1="66" y1="236" x2="146" y2="236"/>
    <line x1="92" y1="292" x2="172" y2="292"/>
  </g>

  <!-- arrow body -->
  <path d="M150 300 L322 128 L394 200 L222 372 Z" fill="#ffcf4d" stroke="#2b2140" stroke-width="26" stroke-linejoin="round"/>

  <!-- fletching -->
  <path d="M150 300 L110 260 Q100 296 122 318 Z" fill="#ff5a2e" stroke="#2b2140" stroke-width="20" stroke-linejoin="round"/>

  <!-- face -->
  <g fill="#2b2140">
    <circle cx="298" cy="188" r="13"/>
    <circle cx="348" cy="238" r="13"/>
  </g>
  <path d="M296 218 Q316 230 330 214" stroke="#2b2140" stroke-width="14" fill="none" stroke-linecap="round"/>

  <!-- target -->
  <g stroke="#2b2140" stroke-width="20" fill="none">
    <circle cx="146" cy="404" r="58" fill="#ffffff"/>
    <circle cx="146" cy="404" r="26"/>
  </g>
  <circle cx="146" cy="404" r="9" fill="#ff5a2e"/>

  <!-- speed sparks -->
  <g stroke="#ffcf4d" stroke-width="16" stroke-linecap="round">
    <line x1="352" y1="330" x2="380" y2="330"/>
    <line x1="332" y1="376" x2="356" y2="376"/>
  </g>
</svg>
